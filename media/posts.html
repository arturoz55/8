<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apogee post images</title>
<style>
@font-face{font-family:"Inter";font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:800;src:url(fonts/inter-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2")}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
/* Seven 1600x900 images for the $APGE launch thread. render(i) draws post i (1-7). Open with #3 to preview post 3. */
const W = 1600, H = 900;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const BLUE = "#5B6CFF", PALE = "#C9CEFF", FG = "#F2F3F7", DIM = "#8C90A1", UP = "#3DD68C", DOWN = "#F0596B";
const SANS = "Inter, 'Liberation Sans', sans-serif", MONO = "'JetBrains Mono', 'DejaVu Sans Mono', monospace";

function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(s, x, y, size, color, o = {}) {
  g.save(); g.font = `${o.weight || 700} ${size}px ${o.mono ? MONO : SANS}`; g.fillStyle = color; g.textAlign = o.align || "center"; g.textBaseline = "middle";
  if (o.spacing) g.letterSpacing = o.spacing + "px"; if (o.glow) { g.shadowColor = "rgba(91,108,255,.8)"; g.shadowBlur = o.glow; }
  g.fillText(s, x, y); g.restore();
}
function wrap(s, x, y, maxW, size, color, lh, o = {}) {
  g.save(); g.font = `${o.weight || 500} ${size}px ${SANS}`; g.fillStyle = color; g.textBaseline = "middle"; g.textAlign = o.align || "left";
  let line = "", yy = y; s.split(" ").forEach(w => { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW) { g.fillText(line, x, yy); line = w; yy += lh; } else line = t; }); g.fillText(line, x, yy); g.restore();
}

/* logo */
const RING = "M3 50a47 12 0 1 0 94 0a47 12 0 1 0-94 0ZM9 48.5a41 6.5 0 1 0 82 0a41 6.5 0 1 0-82 0Z";
const logoSvg = c => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><g transform="rotate(-18 50 50)"><path d="${RING}" fill="#000" stroke="#000" stroke-width="7" fill-rule="evenodd"/><rect width="100" height="47" fill="#fff"/></g></mask></defs><g transform="rotate(-18 50 50)"><path d="${RING}" fill="${c}" fill-rule="evenodd"/></g><circle cx="50" cy="50" r="25" fill="${c}" mask="url(#m)"/></svg>`;
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
let LOGO;
function planet(x, y, size, glow = 0) { g.save(); if (glow) { g.shadowColor = "rgba(91,108,255,.9)"; g.shadowBlur = glow; } g.drawImage(LOGO, x - size / 2, y - size / 2, size, size); g.restore(); }

/* background */
function bg(seed, nx = .75, ny = .25) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const n1 = g.createRadialGradient(W * nx, H * ny, 0, W * nx, H * ny, 800); n1.addColorStop(0, "rgba(64,82,220,.32)"); n1.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = n1; g.fillRect(0, 0, W, H);
  const n2 = g.createRadialGradient(W * .15, H * .9, 0, W * .15, H * .9, 600); n2.addColorStop(0, "rgba(91,108,255,.14)"); n2.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = n2; g.fillRect(0, 0, W, H);
  const r = rng(seed);
  for (let i = 0; i < 320; i++) { const z = r(); g.globalAlpha = .25 + r() * .6; g.fillStyle = z > .7 ? "#E9ECFF" : "#9AA6FF"; g.beginPath(); g.arc(r() * W, r() * H, .5 + z * 1.4, 0, 7); g.fill(); }
  g.globalAlpha = 1;
}
function brand(x = 70, y = 70) { planet(x + 28, y, 60); text("APOGEE", x + 72, y + 2, 30, FG, { align: "left", weight: 800, spacing: 6 }); }
function handle() { text("@UseApogee", W - 70, 72, 26, BLUE, { align: "right", mono: true }); }
function footer(s) { text(s, W / 2, H - 38, 18, "#5A5F70", { weight: 500 }); }
function eyebrow(s, x, y) { text(s, x, y, 22, BLUE, { align: "left", mono: true, spacing: 3 }); }
function panel(x, y, w, h, r = 22, border = "#1E2231") { rrect(x, y, w, h, r); g.fillStyle = "rgba(11,12,17,.94)"; g.fill(); g.strokeStyle = border; g.lineWidth = 2; g.stroke(); }
function orbit(cx, cy, rx, ry, rot, a = .45) { g.save(); g.strokeStyle = `rgba(91,108,255,${a})`; g.setLineDash([4, 10]); g.lineWidth = 2; g.beginPath(); g.ellipse(cx, cy, rx, ry, rot, 0, 7); g.stroke(); g.restore(); }

/* original critter avatars (same family as the site) */
function critter(x, y, s, hue, seed) {
  const r = rng(seed); g.save(); g.translate(x, y); g.scale(s / 64, s / 64);
  rrect(0, 0, 64, 64, 14); g.fillStyle = `hsl(${(hue + 200) % 360} 35% 16%)`; g.fill(); g.clip();
  const ear = Math.floor(r() * 3); g.fillStyle = `hsl(${hue} 60% 46%)`;
  if (ear === 0) { g.beginPath(); g.moveTo(16, 26); g.lineTo(14, 6); g.lineTo(28, 18); g.moveTo(48, 26); g.lineTo(50, 6); g.lineTo(36, 18); g.fill(); }
  if (ear === 1) { g.beginPath(); g.arc(17, 18, 8, 0, 7); g.arc(47, 18, 8, 0, 7); g.fill(); }
  if (ear === 2) { g.beginPath(); g.ellipse(23, 10, 5, 13, 0, 0, 7); g.ellipse(41, 10, 5, 13, 0, 0, 7); g.fill(); }
  g.fillStyle = `hsl(${hue} 72% 62%)`; g.beginPath(); g.ellipse(32, 38, 22, 21, 0, 0, 7); g.fill();
  g.fillStyle = `hsl(${hue} 85% 84%)`; g.beginPath(); g.ellipse(32, 46, 13, 10, 0, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(22, 33, 5.5, 0, 7); g.arc(42, 33, 5.5, 0, 7); g.fill();
  g.fillStyle = "#0A0D1A"; g.beginPath(); g.arc(23, 34, 3, 0, 7); g.arc(43, 34, 3, 0, 7); g.fill();
  g.strokeStyle = "#0A0D1A"; g.lineWidth = 2; g.lineCap = "round"; g.beginPath(); g.moveTo(28, 43); g.quadraticCurveTo(32, 47, 36, 43); g.stroke();
  g.restore();
}
const CH9 = [["Solana", "S", ["#9945FF", "#14F195"]], ["Ethereum", "E", "#627EEA"], ["Base", "B", "#0052FF"], ["BNB Chain", "B", "#F3BA2F", "#111"], ["Arbitrum", "A", "#28A0F0"], ["Polygon", "P", "#8247E5"], ["Avalanche", "A", "#E84142"], ["Optimism", "O", "#FF0420"], ["Robinhood Chain", "R", "#CCFF00", "#111"]];
function badge(x, y, r, c) {
  let fill = c[2]; if (Array.isArray(fill)) { const gr = g.createLinearGradient(x - r, y - r, x + r, y + r); gr.addColorStop(0, fill[0]); gr.addColorStop(1, fill[1]); fill = gr; }
  g.save(); g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 12; g.fillStyle = fill; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
  text(c[1], x, y + 1, r * .95, c[3] || "#fff", { weight: 800 });
}
function headline(lines, x, y, size, opts = {}) { lines.forEach((l, i) => text(l, x, y + i * size * 1.08, size, i === opts.hi ? PALE : FG, { align: opts.align || "left", weight: 800 })); }

/* ---------- posts ---------- */
const POSTS = {
  1() { // launch
    bg(11, .5, .35); handle(); brand();
    orbit(W / 2, 330, 520, 120, -.3, .5); orbit(W / 2, 330, 640, 160, -.3, .22);
    planet(W / 2, 300, 300, 70);
    g.save(); g.font = `800 150px ${SANS}`; g.textAlign = "center"; g.textBaseline = "middle"; const gr = g.createLinearGradient(W / 2 - 520, 0, W / 2 + 520, 0); gr.addColorStop(0, "#FFFFFF"); gr.addColorStop(.55, PALE); gr.addColorStop(1, BLUE); g.fillStyle = gr; g.shadowColor = "rgba(91,108,255,.7)"; g.shadowBlur = 50; g.fillText("$APGE IS LIVE", W / 2, 560); g.restore();
    rrect(W / 2 - 380, 650, 760, 66, 33); g.fillStyle = "rgba(91,108,255,.14)"; g.fill(); g.strokeStyle = BLUE; g.lineWidth = 2; g.stroke();
    text("CA: only from @UseApogee", W / 2, 684, 28, FG, { mono: true });
    CH9.forEach((c, i) => badge(W / 2 + (i - 4) * 56, 778, 20, c));
    footer("Not financial advice. Verify the contract address on @UseApogee before you buy.");
  },
  2() { // what is apogee
    bg(22); handle(); brand();
    eyebrow("WHAT IS APOGEE", 70, 200); headline(["The terminal", "for every chain."], 70, 270, 68);
    wrap("Launches, wallet tracking, perps and cashback on one screen. Spot it first, trade it in one click.", 70, 440, 560, 30, DIM, 44);
    const x = 720, y = 160, w = 810, h = 620; panel(x, y, w, h, 22, "#2E3550");
    ["Fresh", "Bonding", "Graduated"].forEach((t, c) => { const cx = x + 26 + c * 186; text(t, cx, y + 40, 20, DIM, { align: "left", weight: 500 });
      for (let i = 0; i < 6; i++) { const ry = y + 70 + i * 86; critter(cx, ry, 48, [24, 160, 210, 270, 320, 42][(i + c) % 6], i * 13 + c * 7 + 5); g.fillStyle = "#2A3047"; g.fillRect(cx + 58, ry + 10, 90 + (i * 17 + c * 11) % 30, 9); g.fillStyle = BLUE; g.fillRect(cx + 58, ry + 32, 40 + (i * 37 + c * 23) % 80, 6); } });
    const ox = x + 590, oy = y + 30; rrect(ox, oy, 196, h - 60, 16); g.fillStyle = "#07080C"; g.fill(); g.strokeStyle = "#1E2231"; g.stroke();
    let v = .5; const R = rng(3); g.beginPath(); for (let i = 0; i < 40; i++) { v = Math.max(.1, Math.min(.9, v + (R() - .45) * .12)); const px = ox + 14 + i * 4.3, py = oy + 160 - v * 120; i ? g.lineTo(px, py) : g.moveTo(px, py); } g.strokeStyle = "#7D8BFF"; g.lineWidth = 3; g.stroke();
    rrect(ox + 14, oy + 200, 168, 44, 10); g.fillStyle = "rgba(61,214,140,.16)"; g.fill(); text("Buy", ox + 98, oy + 222, 22, UP);
    ["0.1", "0.5", "1", "2"].forEach((p, i) => { rrect(ox + 14 + i * 43, oy + 260, 37, 32, 6); g.strokeStyle = i === 2 ? BLUE : "#2A3047"; g.stroke(); text(p, ox + 32 + i * 43, oy + 276, 14, i === 2 ? BLUE : FG, { mono: true }); });
    rrect(ox + 14, oy + 310, 168, 52, 10); g.fillStyle = UP; g.fill(); text("Buy 1 SOL", ox + 98, oy + 336, 20, "#06140D", { weight: 800 });
    text("B  buy   S  sell", ox + 98, oy + 400, 15, DIM, { mono: true });
    footer("apogee · @UseApogee");
  },
  3() { // 9 chains
    bg(33, .5, .5); handle(); brand();
    const cx = 1080, cy = 470; orbit(cx, cy, 380, 300, 0, .35); orbit(cx, cy, 250, 190, 0, .25); planet(cx, cy, 240, 60);
    CH9.forEach((c, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 9, x = cx + Math.cos(a) * 380, y = cy + Math.sin(a) * 300; badge(x, y, 34, c); text(c[0], x, y + 56, 19, FG, { weight: 700 }); });
    eyebrow("9 CHAINS · 1 TERMINAL", 70, 230); headline(["Every chain", "in one orbit."], 70, 300, 76);
    wrap("Solana, Ethereum, Base, BNB Chain, Arbitrum, Polygon, Avalanche, Optimism and Robinhood Chain. Switch in one click, each with its own balance.", 70, 480, 520, 28, DIM, 42);
    footer("@UseApogee");
  },
  4() { // pulse
    bg(44, .3, .2); handle(); brand();
    eyebrow("PULSE", 70, 190); headline(["See launches", "before the crowd."], 70, 255, 54);
    wrap("Watch tokens move from launch to bonding curve to a full listing, updated every block.", 70, 390, 470, 28, DIM, 42);
    const cols = [["Fresh", "just launched"], ["Bonding", "curve filling"], ["Graduated", "on a DEX"]];
    cols.forEach(([t, sub], c) => {
      const x = 600 + c * 320, y = 170; panel(x, y, 296, 620, 18, c === 1 ? BLUE : "#1E2231");
      text(t, x + 22, y + 38, 26, FG, { align: "left", weight: 800 }); text(sub, x + 22, y + 70, 17, DIM, { align: "left", weight: 500 });
      for (let i = 0; i < 6; i++) { const ry = y + 104 + i * 84; critter(x + 20, ry, 50, [210, 24, 160, 320, 42, 270][(i + c * 2) % 6], 300 + i * 7 + c * 31);
        g.fillStyle = "#2A3047"; g.fillRect(x + 82, ry + 10, 110 + (i * 23) % 50, 9);
        const prog = c === 2 ? 1 : c === 1 ? .45 + ((i * 13) % 45) / 100 : .05 + ((i * 11) % 25) / 100;
        g.fillStyle = "#1E2231"; g.fillRect(x + 82, ry + 34, 180, 6); const gr = g.createLinearGradient(x + 82, 0, x + 262, 0); gr.addColorStop(0, BLUE); gr.addColorStop(1, PALE); g.fillStyle = gr; g.fillRect(x + 82, ry + 34, 180 * prog, 6); }
      if (c < 2) text("→", x + 308, y + 310, 34, BLUE, { weight: 800 });
    });
    footer("Illustration of the Pulse board · @UseApogee");
  },
  5() { // wallet tracker
    bg(55, .8, .7); handle(); brand();
    eyebrow("WALLET TRACKER", 70, 190); headline(["Follow the wallets", "that move first."], 70, 255, 64);
    wrap("Track up to 300 wallets. Get an alert the moment they buy or sell, and copy the trade in one click.", 70, 410, 480, 28, DIM, 42);
    const rows = [["Night Owl", true, "2.40", "GLOTOAD"], ["Quiet Whale", false, "7.10", "MOSSKOI"], ["Early Bird", true, "0.85", "VOLTYAK"], ["Sniper Fox", true, "3.30", "ECHOFOX"], ["Lucky Seven", false, "1.20", "PIXELOWL"], ["Slow Turtle", true, "5.00", "DRIFTCRAB"]];
    rows.forEach(([n, buy, amt, sym], i) => {
      const x = 640, y = 160 + i * 106; panel(x, y, 890, 90, 16, i === 0 ? BLUE : "#1E2231");
      critter(x + 18, y + 14, 62, [210, 24, 160, 320, 42, 270][i], 900 + i * 131);
      rrect(x + 100, y + 29, 74, 32, 7); g.fillStyle = buy ? "rgba(61,214,140,.16)" : "rgba(240,89,107,.16)"; g.fill(); text(buy ? "BUY" : "SELL", x + 137, y + 45, 17, buy ? UP : DOWN, { mono: true });
      text(`${n} ${buy ? "bought" : "sold"} ${amt} SOL of ${sym}`, x + 194, y + 45, 24, FG, { align: "left", weight: 500 });
      rrect(x + 780, y + 26, 90, 38, 10); g.fillStyle = buy ? BLUE : "#1A1C24"; g.fill(); text(buy ? "Copy" : "Mute", x + 825, y + 45, 18, buy ? "#05061A" : DIM, { weight: 800 });
    });
    footer("Illustrative wallets and trades · @UseApogee");
  },
  6() { // cashback & tiers
    bg(66, .3, .7); handle(); brand();
    eyebrow("REWARDS", 70, 190); headline(["Every trade", "pays you back."], 70, 255, 72);
    wrap("Cashback on every swap, paid in the chain's native coin. Climb the tiers to get a bigger share of your fees back.", 70, 420, 500, 28, DIM, 42);
    [["0.12", 0], ["0.05", 1], ["0.31", 2]].forEach(([v, i]) => { const x = 680 + i * 30, y = 170 + i * 110; panel(x, y, 520, 92, 16, "#2A3047");
      text(`${v} SOL received`, x + 28, y + 34, 28, FG, { align: "left", weight: 800 }); text("Cashback for your last trade", x + 28, y + 66, 19, DIM, { align: "left", weight: 500 }); text("now", x + 492, y + 34, 17, DIM, { align: "right", mono: true }); });
    const tiers = [["Comet", "10%"], ["Orbit", "20%"], ["Supernova", "50%"]];
    tiers.forEach(([t, p], i) => { const x = 680 + i * 290, y = 560; panel(x, y, 260, 190, 18, i === 2 ? BLUE : "#1E2231");
      if (i === 2) { g.save(); g.shadowColor = "rgba(91,108,255,.6)"; g.shadowBlur = 30; rrect(x, y, 260, 190, 18); g.strokeStyle = BLUE; g.stroke(); g.restore(); }
      text(t.toUpperCase(), x + 130, y + 46, 20, DIM, { mono: true, spacing: 3 }); text(p, x + 130, y + 106, 58, i === 2 ? PALE : FG, { weight: 800 }); text("of fees back", x + 130, y + 156, 18, DIM, { weight: 500 });
      if (i < 2) text("›", x + 275, y + 95, 40, BLUE, { weight: 800 }); });
    footer("Illustrative amounts · @UseApogee");
  },
  7() { // safety
    bg(77, .5, .4); handle(); brand();
    const cx = 420, cy = 470; g.save(); g.shadowColor = "rgba(91,108,255,.7)"; g.shadowBlur = 60;
    g.beginPath(); g.moveTo(cx, cy - 190); g.lineTo(cx + 160, cy - 120); g.lineTo(cx + 160, cy + 10); g.bezierCurveTo(cx + 160, cy + 120, cx + 80, cy + 180, cx, cy + 210); g.bezierCurveTo(cx - 80, cy + 180, cx - 160, cy + 120, cx - 160, cy + 10); g.lineTo(cx - 160, cy - 120); g.closePath();
    const gr = g.createLinearGradient(cx, cy - 190, cx, cy + 210); gr.addColorStop(0, "#7483FF"); gr.addColorStop(1, "#2B37A8"); g.fillStyle = gr; g.fill(); g.restore();
    g.strokeStyle = "#fff"; g.lineWidth = 22; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(cx - 62, cy + 6); g.lineTo(cx - 12, cy + 56); g.lineTo(cx + 74, cy - 40); g.stroke();
    eyebrow("STAY SAFE", 720, 200); headline(["Only trust", "the official CA."], 720, 270, 74);
    const items = ["The official $APGE CA is only posted by @UseApogee.", "We never DM first. Never share your seed phrase.", "Check the address before you buy.", "Not financial advice. Trade only what you can lose."];
    items.forEach((t, i) => { const y = 450 + i * 74; g.fillStyle = i === 3 ? DOWN : UP; g.beginPath(); g.arc(736, y, 9, 0, 7); g.fill(); wrap(t, 762, y, 760, 28, i === 3 ? DIM : FG, 36, { weight: 500 }); });
    footer("@UseApogee");
  }
};
async function render(i) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; POSTS[i](); }
window.ready = (async () => {
  for (const w of [500, 700, 800]) await document.fonts.load(`${w} 40px Inter`);
  await document.fonts.load(`500 40px "JetBrains Mono"`); await document.fonts.load(`700 40px "JetBrains Mono"`);
  LOGO = await loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(logoSvg("#F2F3F7")));
  render(+(location.hash.slice(1)) || 1); return true;
})();
window.render = render;
</script>
</body>
</html>
